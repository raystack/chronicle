site:
  title: Versioned Example
  description: Multi-content + multi-version sample

authors:
  jane:
    name: Jane Doe
    bio: Writes about the parts of the system nobody else wants to document.
    url: https://github.com/jane
    email: jane@example.com

theme:
  name: paper

content:
  - dir: docs
    label: Docs
    description: A reference manual for the core platform and services. Covers authentication, data models, API integrations, deployment guides, and troubleshooting. Everything you need to get started with the platform and build production-ready applications.
  - dir: dev
    label: Dev Docs
    description: Developer guides for building integrations and extensions
  - dir: ops
    label: Ops Guide
    description: Operations handbook for deployment, monitoring, and incident response
  - dir: design
    label: Design System
    description: Component library documentation, design tokens, and usage patterns

latest:
  label: "3.0"
  landing: true

versions:
  - dir: v2
    label: "2.0"
    content:
      - dir: docs
        label: Docs

  - dir: v1
    label: "1.0"
    landing: true
    badge:
      label: deprecated
      variant: warning
    content:
      - dir: dev
        label: Developer Guide
      - dir: docs
        label: Docs

links:
  - label: Go to app
    href: https://example.com
  - label: Support
    href: https://example.com/support

search:
  enabled: true
  placeholder: Search...
