name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./packages/chronicle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

  smoke-test:
    name: Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test
        working-directory: ./packages/chronicle

      - name: Build CLI
        run: bun run build:cli
        working-directory: ./packages/chronicle

      - name: Build example
        run: ./packages/chronicle/bin/chronicle.js build --config examples/basic/chronicle.yaml
        shell: bash

      - name: Smoke test dev server
        shell: bash
        run: ./scripts/smoke-test.sh dev 3001

      - name: Smoke test start server
        shell: bash
        run: ./scripts/smoke-test.sh start 3002
