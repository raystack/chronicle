name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./packages/chronicle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

  docker:
    name: Docker (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - runtime: bun
            dockerfile: docker/Dockerfile.bun
          - runtime: node
            dockerfile: docker/Dockerfile.node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f ${{ matrix.dockerfile }} -t chronicle-${{ matrix.runtime }} .

      - name: Run container
        run: docker run -d --name chronicle-${{ matrix.runtime }} -p 3000:3000 chronicle-${{ matrix.runtime }}

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          docker logs chronicle-${{ matrix.runtime }}
          exit 1

      - name: Verify redirect
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          echo "Root status: $STATUS"
          [ "$STATUS" = "307" ]

      - name: Verify docs page
        run: curl -sL http://localhost:3000/docs | grep -q 'id="root"'

      - name: Verify search API
        run: curl -s http://localhost:3000/api/search | grep -q '"url"'

      - name: Cleanup
        if: always()
        run: docker rm -f chronicle-${{ matrix.runtime }} || true
